framework: "net10.0"
overview: "See where your library storage goes and re-encode to save space"
description: >
  Scans every library and shows which folders and files use the most space.
  Re-encodes files to HEVC or AV1 with quality checks, remuxes out audio and
  subtitle tracks you don't need, converts audio, handles HDR, and finds
  duplicates, unwatched media and leftover files.
category: "General"
owner: "CyanicTempest"
artifacts:
- "Jellyfin.Plugin.DataManager.dll"
changelog: >
  The list and the re-encode window now show one savings number, marked rough,
  from a test encode or final. Whole shows can be suggested, and rows show
  Waiting, Encoding and Re-encoded. Replace moved to the window's footer and
  asks first, and the chosen quality survives a change of codec. The preview
  verdict follows the softest areas. Check now only looks: leftovers are listed
  for review, on a schedule too, and nothing goes until you press Delete. Clean
  up counts each file once. Settings asks before you leave with unsaved
  changes. Remux starts on keeping everything and offers a suggestion. The
  encoding list runs in order with Clear finished. Rows and column headers are
  clickable. Warns when Jellyfin isn't set to decode on the GPU. Encoding and
  Clean up roll up, and a new Customisation panel in Settings sets how each
  starts, and Encoding stays on the page when the queue is empty. The Leftovers
  date has its own line, and a Library filter sits beside Sort, on the same row
  as Search. Phones show compact chips on the rolled-up Clean up heading.
