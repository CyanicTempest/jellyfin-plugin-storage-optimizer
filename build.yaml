framework: "net10.0"
overview: "See where your library storage goes and re-encode to save space"
description: >
  Scans every library and shows which folders and files use the most space.
  Re-encodes files to HEVC or AV1 with quality checks, remuxes out audio and
  subtitle tracks you don't need, converts audio, handles HDR, and finds
  duplicates, unwatched media and leftover files.
category: "General"
owner: "CyanicTempest"
artifacts:
- "Jellyfin.Plugin.DataManager.dll"
changelog: >
  Needs Jellyfin 12.4. The media list has a new Filters panel (library,
  watched, resolution, audio and subtitles, file issues) with removable chips,
  and a Sort menu with order and Group by codec; column headings sort too.
  Re-encode previews keep going while ffmpeg is working and stop only when it
  stalls, a GPU that hangs falls back to the CPU, timeout messages say what to
  try, and a failed preview has a Try again button.
