overview: "See where your library storage goes and re-encode to save space"
description: >
  Scans every library and shows which folders and files use the most space.
  Re-encodes files to HEVC or AV1 with quality checks, remuxes out audio and
  subtitle tracks you don't need, converts audio, handles HDR, and finds
  duplicates, unwatched media and leftover files.
category: "General"
owner: "CyanicTempest"
artifacts:
- "Jellyfin.Plugin.DataManager.dll"
changelog: >
  Needs Jellyfin 12.4. The overview shows free space per disk, and each drive
  can be hidden in Settings. The encode list survives a restart, and failed or
  stopped encodes can be restarted. The scan tags likely file problems, which
  the list can filter by, and it can sort by resolution. Each new file is
  checked in full before it replaces the original, main audio is guarded, and
  track titles and languages can be tidied. Settings add recycling of
  originals, encoding hours, lower priority and default choices. GPUs that
  can't encode 10-bit fall back step by step, HDR to SDR offers four styles,
  and VA-API can decode on the GPU. Unlinked extras are filed under their
  movie's library.
