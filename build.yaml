  The GPU speed test now shows what limits the speed, with the encoder alone
  beside your film, whether the film decoded on the GPU, and speeds in times
  real time. New Keep frames on the GPU setting for NVIDIA cards, off until you
  turn it on. Check detail stops when you close the re-encode window and runs
