changelog: >
  Faster dashboard on big libraries. A kept re-encode shows straight away with
  Compare, no rescan needed. A season's encodes show as one row that opens to
  each episode. New Accept smaller files window to keep re-encodes and delete
  their originals in bulk, and Duplicates now keeps a smaller re-encode. The
  GPU speed test gives repeatable results.
