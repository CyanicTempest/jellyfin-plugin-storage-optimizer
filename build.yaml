overview: "See where your library storage goes and re-encode to save space"
description: >
  Scans every library and shows which folders and files use the most space.
  Re-encodes files to HEVC or AV1 with quality checks, remuxes out audio and
  subtitle tracks you don't need, converts audio, handles HDR, and finds
  duplicates, unwatched media and leftover files.
category: "General"
owner: "CyanicTempest"
