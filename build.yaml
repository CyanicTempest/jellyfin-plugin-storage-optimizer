changelog: >
  Encoding and Clean up now roll up, and a new Customisation panel in Settings
  sets how each starts. Encoding stays on the page when the queue is empty,
  with an Empty tag. Clean up's tiles line up, and the Leftovers date has its
  own line. A new Library filter sits beside Sort on the same row as Search,
  replacing the library tabs. A language track that runs longer than the film
  no longer makes a correct encode look cut short.
