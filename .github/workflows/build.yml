# SPDX-License-Identifier: GPL-3.0-only
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/Jellyfin.Plugin.DataManager.Tests -c Release
      - run: dotnet publish Jellyfin.Plugin.DataManager -c Release -o build-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Jellyfin.Plugin.DataManager
          path: |
            build-output/Jellyfin.Plugin.DataManager.dll
            LICENSE
            THIRD-PARTY-NOTICES.md
