# SPDX-License-Identifier: GPL-3.0-only
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/Jellyfin.Plugin.DataManager.Tests -c Release
      - run: dotnet publish Jellyfin.Plugin.DataManager -c Release -o build-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jellyfin.Plugin.DataManager
          path: |
            build-output/Jellyfin.Plugin.DataManager.dll
            LICENSE
            THIRD-PARTY-NOTICES.md
