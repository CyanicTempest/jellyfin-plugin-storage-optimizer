# SPDX-License-Identifier: GPL-3.0-only
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/Jellyfin.Plugin.DataManager.Tests -c Release
      - run: dotnet publish Jellyfin.Plugin.DataManager -c Release -o build-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Jellyfin.Plugin.DataManager
          path: |
            build-output/Jellyfin.Plugin.DataManager.dll
            LICENSE
            THIRD-PARTY-NOTICES.md
